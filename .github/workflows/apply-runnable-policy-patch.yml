name: Apply runnable policy patch

on:
  push:
    branches:
      - feat/linear-integration-foundation
    paths:
      - .github/workflows/apply-runnable-policy-patch.yml
      - scripts/apply-runnable-policy-patch.mjs

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/linear-integration-foundation
          fetch-depth: 0
      - name: Apply exact-source patch
        run: node scripts/apply-runnable-policy-patch.mjs
      - name: Validate patch diff
        run: |
          git diff --check
          git diff --exit-code -- scripts/codex-injector.mjs && exit 1 || true
      - name: Commit patched injector
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/codex-injector.mjs
          git commit -m "feat: wire runnable Todo automation policy"
          git push origin HEAD:feat/linear-integration-foundation
