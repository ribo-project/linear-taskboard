name: Linear integration fast check

on:
  push:
    branches:
      - feat/linear-integration-foundation
    paths:
      - .github/workflows/linear-fast-check.yml

permissions:
  contents: write

jobs:
  check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/linear-integration-foundation
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Remove one-time workflow after success
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/linear-fast-check.yml
          git commit -m "chore: remove one-time Linear fast check"
          git push origin HEAD:feat/linear-integration-foundation
